<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduDrive 3D Multiplayer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; touch-action: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Math Box Glow Animation */
        @keyframes pulse-border {
            0% { border-color: rgba(250, 204, 21, 0.5); box-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
            50% { border-color: rgba(250, 204, 21, 1); box-shadow: 0 0 20px rgba(250, 204, 21, 0.8); }
            100% { border-color: rgba(250, 204, 21, 0.5); box-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        }
        .math-modal-border { animation: pulse-border 2s infinite; }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-container" class="ui-layer flex items-center justify-center bg-gray-900 bg-opacity-80 transition-opacity duration-300 pointer-events-auto">
        
        <!-- Start Menu -->
        <div id="start-menu" class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-transform duration-300 scale-100">
            <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-2">EduDrive 3D</h1>
            <p class="text-center text-gray-500 mb-6">Learn and Race Together</p>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Choose Car Color</label>
                <div class="flex items-center space-x-4">
                    <input type="color" id="car-color" value="#0066ff" class="h-10 w-20 rounded cursor-pointer border border-gray-300">
                    <span class="text-sm text-gray-500">Pick your style!</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="border-t border-gray-200 pt-4">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Host a Game</h3>
                    <button id="btn-create" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md">
                        Create Room
                    </button>
                </div>

                <div class="border-t border-gray-200 pt-4">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Join a Game</h3>
                    <div class="flex space-x-2">
                        <input type="text" id="join-code" placeholder="3-digit code" maxlength="3" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-3 text-center text-xl tracking-widest uppercase">
                        <button id="btn-join" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl transition duration-200 shadow-md">
                            Join
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="connection-status" class="mt-4 text-center text-sm font-medium text-red-500 hidden"></div>
        </div>

        <!-- Room Lobby Info (Hidden initially) -->
        <div id="lobby-info" class="hidden absolute top-6 right-6 bg-white bg-opacity-90 rounded-xl shadow-lg p-4 pointer-events-auto border border-gray-200">
            <p class="text-sm text-gray-500 font-semibold mb-1">Room Code</p>
            <p id="display-room-code" class="text-3xl font-black text-blue-600 tracking-widest">---</p>
            <p id="player-count" class="text-xs text-gray-400 mt-2 text-right">Players: 1</p>
        </div>

    </div>

    <!-- Math Question Modal -->
    <div id="math-modal" class="hidden ui-layer flex items-center justify-center bg-black bg-opacity-60 pointer-events-auto">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 border-4 math-modal-border text-center">
            <div class="text-5xl mb-4">📚</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Math Challenge!</h2>
            <p class="text-gray-600 mb-6">Answer correctly for a speed boost.</p>
            
            <div class="bg-gray-100 p-4 rounded-xl mb-6">
                <p class="text-lg font-bold text-gray-800">비례식 3:4 = 9:x 에서<br>x의 값은?</p>
            </div>

            <input type="number" id="math-answer" placeholder="Enter answer..." class="w-full bg-white border-2 border-gray-300 text-gray-900 rounded-xl focus:ring-yellow-500 focus:border-yellow-500 block p-3 text-center text-xl mb-4">
            
            <div id="math-feedback" class="text-sm font-bold mb-4 h-5 hidden"></div>

            <button id="btn-submit-math" class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold py-3 px-4 rounded-xl transition duration-200 shadow-md">
                제출 (Submit)
            </button>
        </div>
    </div>

    <!-- HUD Indicator -->
    <div id="hud" class="hidden ui-layer absolute bottom-6 left-1/2 transform -translate-x-1/2 text-center pointer-events-none">
        <div id="boost-indicator" class="hidden bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black px-6 py-2 rounded-full shadow-lg text-lg animate-bounce">
            ⚡ SPEED BOOST ACTIVE! ⚡
        </div>
        <p class="text-white text-sm mt-2 text-shadow drop-shadow-md bg-black bg-opacity-30 px-3 py-1 rounded-full">Use Arrow Keys to drive. Find the Yellow Box!</p>
    </div>

    <script>
        /* =========================================================================
           Three.js External OBJ Loading Example (Commented Out as requested)
           ========================================================================= 
           
        // To use an external OBJ file, you need to include the OBJLoader script in <head>:
        // <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"><\/script>
        
        function loadExternalCarModel(scene, colorHex, position) {
            const loader = new THREE.OBJLoader();
            
            // Example GitHub URL to a raw OBJ file
            const objUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/obj/cerberus/Cerberus.obj';
            
            loader.load(
                objUrl,
                function ( object ) {
                    // Apply color and standard material to the loaded mesh
                    object.traverse(function(child) {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({ 
                                color: colorHex,
                                roughness: 0.5,
                                metalness: 0.5
                            });
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    // Scale and position
                    object.scale.set(0.1, 0.1, 0.1); 
                    object.position.copy(position);
                    
                    scene.add( object );
                },
                function ( xhr ) { console.log((xhr.loaded / xhr.total * 100) + '% loaded'); },
                function ( error ) { console.error('An error happened loading OBJ', error); }
            );
        }
        */

        // =========================================================================
        // Game State & Variables
        // =========================================================================
        let gameState = 'menu'; // menu, playing, math
        let myColor = '#0066ff';
        
        // Physics / Movement
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };
        let speed = 0;
        let baseMaxSpeed = 0.4;
        let maxSpeed = baseMaxSpeed;
        let acceleration = 0.015;
        let friction = 0.008;
        let rotationSpeed = 0.04;
        
        // Powerups
        let hasBoost = false;
        let boostTimer = 0;
        let mathBoxActive = true;

        // Multiplayer
        let peer = null;
        let myRoomId = null;
        let connections = []; // Array of PeerJS DataConnections
        let remotePlayers = {}; // Dictionary mapping peer IDs to Three.js Groups

        // =========================================================================
        // Three.js Setup
        // =========================================================================
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x4ade80, // Grass green
            roughness: 0.8,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid Helper for depth perception
        const grid = new THREE.GridHelper(200, 100, 0x000000, 0x000000);
        grid.material.opacity = 0.1;
        grid.material.transparent = true;
        scene.add(grid);

        // Scenery (Trees)
        function createTree(x, z) {
            const tree = new THREE.Group();
            
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({color: 0x8B4513});
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            tree.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(2, 4, 8);
            const leavesMat = new THREE.MeshStandardMaterial({color: 0x228B22});
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 4;
            leaves.castShadow = true;
            leaves.receiveShadow = true;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        // Add some random trees
        for(let i=0; i<30; i++) {
            let tx = (Math.random() - 0.5) * 150;
            let tz = (Math.random() - 0.5) * 150;
            if(Math.abs(tx) > 10 || Math.abs(tz) > 10) createTree(tx, tz);
        }

        // =========================================================================
        // Game Objects
        // =========================================================================
        
        // Helper to build a stylized car using primitives
        function buildCar(colorHex) {
            const carGroup = new THREE.Group();
            
            // Chassis material
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                roughness: 0.4, 
                metalness: 0.1 
            });

            // Lower body
            const baseGeo = new THREE.BoxGeometry(2, 0.5, 4);
            const base = new THREE.Mesh(baseGeo, bodyMat);
            base.position.y = 0.5;
            base.castShadow = true;
            base.receiveShadow = true;
            carGroup.add(base);

            // Cabin
            const cabinGeo = new THREE.BoxGeometry(1.5, 0.6, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.05;
            cabin.position.z = -0.2;
            cabin.castShadow = true;
            cabin.receiveShadow = true;
            carGroup.add(cabin);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

            const wheelPositions = [
                [-1.1, 0.4, 1.2],
                [1.1, 0.4, 1.2],
                [-1.1, 0.4, -1.2],
                [1.1, 0.4, -1.2]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        // My Player
        let myCar = null;

        // Math Box (Educational Interaction)
        const boxGeo = new THREE.BoxGeometry(2, 2, 2);
        const boxMat = new THREE.MeshStandardMaterial({ 
            color: 0xfacc15, // Yellow
            emissive: 0xfacc15,
            emissiveIntensity: 0.4
        });
        const mathBox = new THREE.Mesh(boxGeo, boxMat);
        mathBox.position.set(0, 1.5, -20);
        mathBox.castShadow = true;
        scene.add(mathBox);

        // =========================================================================
        // Input Handling
        // =========================================================================
        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================================================
        // Game Logic Loop
        // =========================================================================
        const clock = new THREE.Clock();

        function updateMyCar() {
            if (!myCar || gameState !== 'playing') return;

            // Forward / Backward
            if (keys.ArrowUp || keys.w) {
                speed += acceleration;
            } else if (keys.ArrowDown || keys.s) {
                speed -= acceleration;
            }

            // Apply friction
            if (speed > 0) speed = Math.max(0, speed - friction);
            if (speed < 0) speed = Math.min(0, speed + friction);

            // Clamp speed
            speed = Math.max(-maxSpeed * 0.5, Math.min(maxSpeed, speed));

            // Rotation (only turn if moving)
            if (Math.abs(speed) > 0.01) {
                const turnFactor = speed > 0 ? 1 : -1;
                if (keys.ArrowLeft || keys.a) {
                    myCar.rotation.y += rotationSpeed * turnFactor;
                }
                if (keys.ArrowRight || keys.d) {
                    myCar.rotation.y -= rotationSpeed * turnFactor;
                }
            }

            // Move vehicle
            myCar.translateZ(-speed);

            // Keep within bounds roughly
            myCar.position.x = Math.max(-95, Math.min(95, myCar.position.x));
            myCar.position.z = Math.max(-95, Math.min(95, myCar.position.z));

            // Update Camera (Chase Cam)
            const relativeCameraOffset = new THREE.Vector3(0, 4, 8);
            const cameraOffset = relativeCameraOffset.applyMatrix4(myCar.matrixWorld);
            
            // Smooth camera follow
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(myCar.position);

            // Check collision with Math Box
            if (mathBoxActive && myCar.position.distanceTo(mathBox.position) < 3.5) {
                triggerMathQuestion();
            }

            // Manage Boost Timer
            if (hasBoost) {
                boostTimer -= clock.getDelta();
                if (boostTimer <= 0) {
                    hasBoost = false;
                    maxSpeed = baseMaxSpeed;
                    document.getElementById('boost-indicator').classList.add('hidden');
                }
            }

            // Broadcast state to peers
            broadcastState();
        }

        function triggerMathQuestion() {
            gameState = 'math';
            keys.ArrowUp = keys.ArrowDown = keys.ArrowLeft = keys.ArrowRight = false;
            speed = 0; // Stop car
            
            document.getElementById('math-modal').classList.remove('hidden');
            document.getElementById('math-answer').value = '';
            document.getElementById('math-answer').focus();
            document.getElementById('math-feedback').classList.add('hidden');
        }

        document.getElementById('btn-submit-math').addEventListener('click', checkMathAnswer);
        document.getElementById('math-answer').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') checkMathAnswer();
        });

        function checkMathAnswer() {
            const ans = document.getElementById('math-answer').value.trim();
            const feedback = document.getElementById('math-feedback');
            feedback.classList.remove('hidden', 'text-red-500', 'text-green-500');

            if (ans === '12') {
                // Correct!
                feedback.textContent = 'Correct! Speed Boost Applied! 🚀';
                feedback.classList.add('text-green-500');
                
                setTimeout(() => {
                    document.getElementById('math-modal').classList.add('hidden');
                    gameState = 'playing';
                    
                    // Apply Boost
                    hasBoost = true;
                    maxSpeed = baseMaxSpeed * 2;
                    boostTimer = 10; // 10 seconds of boost
                    document.getElementById('boost-indicator').classList.remove('hidden');

                    // Relocate math box
                    mathBox.position.set(
                        (Math.random() - 0.5) * 80,
                        1.5,
                        (Math.random() - 0.5) * 80
                    );
                    
                    // Reset clock delta so timer doesn't jump
                    clock.getDelta(); 
                }, 1000);
            } else {
                // Incorrect
                feedback.textContent = 'Incorrect. Try again! (Hint: 3/4 = 9/x)';
                feedback.classList.add('text-red-500');
            }
        }

        function updateEnvironment() {
            // Animate Math Box
            if(mathBoxActive) {
                mathBox.rotation.x += 0.01;
                mathBox.rotation.y += 0.02;
                mathBox.position.y = 1.5 + Math.sin(Date.now() * 0.003) * 0.5;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateMyCar();
            updateEnvironment();
            renderer.render(scene, camera);
        }

        // Start animation loop
        window.onload = () => {
            animate();
        };

        // =========================================================================
        // Multiplayer (PeerJS) Logic
        // =========================================================================

        // Generate 3 digit code
        function generateId() {
            return Math.floor(100 + Math.random() * 900).toString(); // 100 to 999
        }

        function initGame(isHost, targetRoomId = null) {
            myColor = document.getElementById('car-color').value;
            
            // Generate prefix to ensure 3-digit IDs don't conflict globally on public peer server, 
            // but keep UI simple. In production, use custom signaling server.
            const ID_PREFIX = 'edudrive-kr-demo-';
            
            let idToRequest = isHost ? generateId() : null;
            myRoomId = idToRequest;

            document.getElementById('connection-status').classList.remove('hidden');
            document.getElementById('connection-status').textContent = 'Connecting...';

            // Initialize Peer
            const fullId = isHost ? ID_PREFIX + idToRequest : null;
            peer = new Peer(fullId);

            peer.on('open', (id) => {
                console.log('My peer ID is: ' + id);
                
                if (isHost) {
                    startGame();
                } else {
                    // We are joining
                    myRoomId = targetRoomId;
                    const conn = peer.connect(ID_PREFIX + targetRoomId);
                    setupConnection(conn);
                    conn.on('open', () => {
                        startGame();
                        // Send my color to host immediately
                        conn.send({ type: 'init', color: myColor });
                    });
                }
            });

            peer.on('connection', (conn) => {
                // Someone joined my room
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                console.error(err);
                document.getElementById('connection-status').textContent = 'Connection Error: ' + err.type;
                document.getElementById('connection-status').classList.add('text-red-500');
            });
        }

        function setupConnection(conn) {
            connections.push(conn);
            updatePlayerCount();

            conn.on('data', (data) => {
                if (data.type === 'init') {
                    // Remote player registered color
                    createRemotePlayer(conn.peer, data.color);
                    // Send my color back
                    conn.send({ type: 'init_reply', color: myColor });
                } else if (data.type === 'init_reply') {
                    createRemotePlayer(conn.peer, data.color);
                } else if (data.type === 'update') {
                    // Update remote player position
                    if (remotePlayers[conn.peer]) {
                        remotePlayers[conn.peer].position.set(data.x, data.y, data.z);
                        remotePlayers[conn.peer].rotation.y = data.ry;
                    } else {
                        // In case we missed init, default to grey
                        createRemotePlayer(conn.peer, '#888888');
                    }
                }
            });

            conn.on('close', () => {
                removeRemotePlayer(conn.peer);
                connections = connections.filter(c => c !== conn);
                updatePlayerCount();
            });
        }

        function broadcastState() {
            if (!myCar || connections.length === 0) return;
            
            const data = {
                type: 'update',
                x: myCar.position.x,
                y: myCar.position.y,
                z: myCar.position.z,
                ry: myCar.rotation.y
            };

            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(data);
                }
            });
        }

        function createRemotePlayer(peerId, colorHex) {
            if (remotePlayers[peerId]) return; // Already exists
            console.log('Creating remote player:', peerId, colorHex);
            const rCar = buildCar(colorHex);
            scene.add(rCar);
            remotePlayers[peerId] = rCar;
        }

        function removeRemotePlayer(peerId) {
            if (remotePlayers[peerId]) {
                scene.remove(remotePlayers[peerId]);
                delete remotePlayers[peerId];
            }
        }

        function updatePlayerCount() {
            document.getElementById('player-count').textContent = `Players: ${connections.length + 1}`;
        }

        // =========================================================================
        // UI & Flow
        // =========================================================================

        function startGame() {
            // Hide Menu, Show Game HUD & Lobby Info
            document.getElementById('ui-container').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('lobby-info').classList.remove('hidden');
            
            document.getElementById('display-room-code').textContent = myRoomId;
            updatePlayerCount();

            // Create local car
            myCar = buildCar(myColor);
            myCar.position.set( (Math.random() - 0.5) * 10, 0, (Math.random() - 0.5) * 10 );
            scene.add(myCar);

            gameState = 'playing';
            clock.start();
        }

        // Button Listeners
        document.getElementById('btn-create').addEventListener('click', () => {
            initGame(true);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const code = document.getElementById('join-code').value.trim();
            if (code.length === 3) {
                initGame(false, code);
            } else {
                const status = document.getElementById('connection-status');
                status.textContent = 'Please enter a 3-digit code.';
                status.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
