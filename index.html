<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Racing</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OBJLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Mobile Controls Styling */
        .control-btn {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }

        /* Responsive Mobile Controls container */
        @media (min-width: 768px) {
            #mobile-controls { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-container" class="ui-layer flex items-center justify-center bg-gray-900 bg-opacity-80 transition-opacity duration-300 pointer-events-auto">
        
        <!-- Start Menu -->
        <div id="start-menu" class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-transform duration-300 scale-100">
            <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-2">3D Racing</h1>
            <p class="text-center text-gray-500 mb-6">Multiplayer Track Day</p>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Choose Car Color</label>
                <div class="flex items-center space-x-4">
                    <input type="color" id="car-color" value="#ff0000" class="h-10 w-20 rounded cursor-pointer border border-gray-300">
                    <span class="text-sm text-gray-500">Stand out on the track!</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="border-t border-gray-200 pt-4">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Host a Game</h3>
                    <button id="btn-create" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md">
                        Create Room
                    </button>
                </div>

                <div class="border-t border-gray-200 pt-4">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Join a Game</h3>
                    <div class="flex space-x-2">
                        <input type="text" id="join-code" placeholder="3-digit code" maxlength="3" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-3 text-center text-xl tracking-widest uppercase">
                        <button id="btn-join" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl transition duration-200 shadow-md">
                            Join
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="connection-status" class="mt-4 text-center text-sm font-medium text-red-500 hidden"></div>
        </div>
    </div>

    <!-- HUD Indicator -->
    <div id="hud" class="hidden ui-layer pointer-events-none">
        <!-- Room Lobby Info -->
        <div id="lobby-info" class="absolute top-6 right-6 bg-white bg-opacity-90 rounded-xl shadow-lg p-4 pointer-events-auto border border-gray-200">
            <p class="text-sm text-gray-500 font-semibold mb-1">Room Code</p>
            <p id="display-room-code" class="text-3xl font-black text-blue-600 tracking-widest">---</p>
            <p id="player-count" class="text-xs text-gray-400 mt-2 text-right">Players: 1</p>
        </div>
        
        <!-- Desktop Instructions -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 text-center hidden md:block">
            <p class="text-white text-sm mt-2 text-shadow drop-shadow-md bg-black bg-opacity-30 px-4 py-2 rounded-full">Use Arrow Keys or WASD to drive.</p>
        </div>

        <!-- Mobile Controls Overlay -->
        <div id="mobile-controls" class="absolute bottom-8 left-0 w-full px-6 flex justify-between pointer-events-auto">
            <!-- Left Side: Steering -->
            <div class="flex space-x-4">
                <button id="btn-left" class="control-btn" aria-label="Steer Left">◀</button>
                <button id="btn-right" class="control-btn" aria-label="Steer Right">▶</button>
            </div>
            <!-- Right Side: Pedals -->
            <div class="flex space-x-4">
                <button id="btn-brake" class="control-btn bg-red-500 bg-opacity-50 border-red-300" aria-label="Brake/Reverse">B</button>
                <button id="btn-accel" class="control-btn bg-green-500 bg-opacity-50 border-green-300" aria-label="Accelerate">A</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // Game State & Variables
        // =========================================================================
        let gameState = 'menu'; // menu, playing
        let myColor = '#ff0000';
        
        // Physics / Movement
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };
        let speed = 0;
        let maxSpeed = 0.6;
        let acceleration = 0.02;
        let friction = 0.01;
        let rotationSpeed = 0.05;

        // Multiplayer
        let peer = null;
        let myRoomId = null;
        let connections = []; 
        let remotePlayers = {}; 

        // Shared Base Model Clone
        let loadedBaseCarModel = null;

        // =========================================================================
        // Three.js Setup
        // =========================================================================
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 250;
        dirLight.shadow.camera.left = -100;
        dirLight.shadow.camera.right = 100;
        dirLight.shadow.camera.top = 100;
        dirLight.shadow.camera.bottom = -100;
        scene.add(dirLight);

        // =========================================================================
        // Environment: Procedural Race Track
        // =========================================================================
        function createRaceTrack() {
            // Create a canvas to draw the track texture
            const trackCanvas = document.createElement('canvas');
            trackCanvas.width = 2048;
            trackCanvas.height = 2048;
            const ctx = trackCanvas.getContext('2d');

            // Grass background
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, 0, 2048, 2048);

            // Draw asphalt road (Capsule / Oval shape)
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 200;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Draw track path
            ctx.beginPath();
            ctx.arc(600, 1024, 400, Math.PI/2, Math.PI*1.5);
            ctx.lineTo(1448, 624);
            ctx.arc(1448, 1024, 400, -Math.PI/2, Math.PI/2);
            ctx.closePath();
            ctx.stroke();

            // Draw center dashed line
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.setLineDash([40, 40]);
            ctx.stroke();

            const trackTexture = new THREE.CanvasTexture(trackCanvas);
            trackTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            trackTexture.wrapS = THREE.RepeatWrapping;
            trackTexture.wrapT = THREE.RepeatWrapping;

            const groundGeo = new THREE.PlaneGeometry(400, 400);
            const groundMat = new THREE.MeshStandardMaterial({ 
                map: trackTexture,
                roughness: 0.9,
                metalness: 0.1
            });
            
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        createRaceTrack();

        // =========================================================================
        // Game Objects & Model Loading
        // =========================================================================
        
        // Fallback: Build a basic stylized car
        function buildFallbackCar(colorHex) {
            const carGroup = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.1 });
            
            const baseGeo = new THREE.BoxGeometry(2, 0.5, 4);
            const base = new THREE.Mesh(baseGeo, bodyMat);
            base.position.y = 0.5;
            base.castShadow = true;
            base.receiveShadow = true;
            carGroup.add(base);

            const cabinGeo = new THREE.BoxGeometry(1.5, 0.6, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.y = 1.05;
            cabin.position.z = -0.2;
            cabin.castShadow = true;
            cabin.receiveShadow = true;
            carGroup.add(cabin);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            const wheelPositions = [ [-1.1, 0.4, 1.2], [1.1, 0.4, 1.2], [-1.1, 0.4, -1.2], [1.1, 0.4, -1.2] ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        // Apply specific color to a loaded model
        function applyColorToModel(model, colorHex) {
            const clonedModel = model.clone();
            clonedModel.traverse(function(child) {
                if (child.isMesh) {
                    // Create a new material to avoid sharing among clones
                    child.material = new THREE.MeshStandardMaterial({ 
                        color: colorHex,
                        roughness: 0.3,
                        metalness: 0.6
                    });
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            return clonedModel;
        }

        // Pre-load the Mustang model, or fallback
        function preloadCarModel(callback) {
            const loader = new THREE.OBJLoader();
            // Hypothetical raw github URL based on user specs
            const objUrl = 'https://raw.githubusercontent.com/endloki17-svg/main/main/25-mustang-13.04.2021.obj';
            
            loader.load(
                objUrl,
                function ( object ) {
                    console.log("Custom OBJ loaded successfully.");
                    // Normalize scale and rotation based on standard typical OBJ exports
                    object.scale.set(0.015, 0.015, 0.015);
                    // Often imported models face the wrong way, adjust if necessary
                    // object.rotation.y = Math.PI; 
                    
                    loadedBaseCarModel = object;
                    callback();
                },
                function ( xhr ) {
                    // Progress
                },
                function ( error ) {
                    console.warn('Failed to load custom OBJ. Using fallback box car.', error);
                    loadedBaseCarModel = null; // Signal to use fallback
                    callback();
                }
            );
        }

        // Main function to instantiate a car (Local or Remote)
        function createCar(colorHex) {
            if (loadedBaseCarModel) {
                return applyColorToModel(loadedBaseCarModel, colorHex);
            } else {
                return buildFallbackCar(colorHex);
            }
        }

        let myCar = null;

        // =========================================================================
        // Input Handling (Desktop & Mobile)
        // =========================================================================
        
        // Keyboard
        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        // Mobile Touch Controls
        function setupMobileControls() {
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnAccel = document.getElementById('btn-accel');
            const btnBrake = document.getElementById('btn-brake');

            // Left Steer
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowLeft = true; });
            btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowLeft = false; });
            
            // Right Steer
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowRight = true; });
            btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowRight = false; });

            // Accelerate
            btnAccel.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowUp = true; });
            btnAccel.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowUp = false; });

            // Brake / Reverse
            btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowDown = true; });
            btnBrake.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowDown = false; });
        }
        setupMobileControls();

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================================================
        // Game Logic Loop
        // =========================================================================
        function updateMyCar() {
            if (!myCar || gameState !== 'playing') return;

            // Acceleration logic
            if (keys.ArrowUp || keys.w) {
                speed += acceleration;
            } else if (keys.ArrowDown || keys.s) {
                speed -= acceleration;
            }

            // Friction
            if (speed > 0) speed = Math.max(0, speed - friction);
            if (speed < 0) speed = Math.min(0, speed + friction);

            // Speed Limiting
            speed = Math.max(-maxSpeed * 0.5, Math.min(maxSpeed, speed));

            // Turning logic (only when moving)
            if (Math.abs(speed) > 0.01) {
                const turnFactor = speed > 0 ? 1 : -1;
                if (keys.ArrowLeft || keys.a) {
                    myCar.rotation.y += rotationSpeed * turnFactor;
                }
                if (keys.ArrowRight || keys.d) {
                    myCar.rotation.y -= rotationSpeed * turnFactor;
                }
            }

            // Move the vehicle forward locally along its Z axis
            // Note: If using a custom model that faces a different direction natively, 
            // you might need to translate X or adjust the model's base rotation.
            myCar.translateZ(-speed);

            // Track boundaries roughly (Keep on the 400x400 map)
            myCar.position.x = Math.max(-195, Math.min(195, myCar.position.x));
            myCar.position.z = Math.max(-195, Math.min(195, myCar.position.z));

            // Camera follow (Chase Cam)
            const relativeCameraOffset = new THREE.Vector3(0, 4, 10); // Elevated and behind
            const cameraOffset = relativeCameraOffset.applyMatrix4(myCar.matrixWorld);
            
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(myCar.position);

            broadcastState();
        }

        function animate() {
            requestAnimationFrame(animate);
            updateMyCar();
            renderer.render(scene, camera);
        }

        // Start render loop
        animate();

        // =========================================================================
        // Multiplayer (PeerJS) Logic
        // =========================================================================

        function generateId() {
            return Math.floor(100 + Math.random() * 900).toString(); // 3-digit code
        }

        function initGame(isHost, targetRoomId = null) {
            myColor = document.getElementById('car-color').value;
            
            // Shared prefix to avoid collisions on public PeerJS server
            const ID_PREFIX = 'edudrive-race-v1-'; 
            let idToRequest = isHost ? generateId() : null;
            myRoomId = idToRequest;

            document.getElementById('connection-status').classList.remove('hidden');
            document.getElementById('connection-status').textContent = 'Connecting...';

            const fullId = isHost ? ID_PREFIX + idToRequest : null;
            peer = new Peer(fullId);

            peer.on('open', (id) => {
                if (isHost) {
                    preloadAndStart();
                } else {
                    myRoomId = targetRoomId;
                    const conn = peer.connect(ID_PREFIX + targetRoomId);
                    setupConnection(conn);
                    conn.on('open', () => {
                        preloadAndStart();
                        conn.send({ type: 'init', color: myColor });
                    });
                }
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                console.error(err);
                const status = document.getElementById('connection-status');
                status.textContent = 'Connection Error. Try again.';
                status.classList.add('text-red-500');
            });
        }

        function setupConnection(conn) {
            connections.push(conn);
            updatePlayerCount();

            conn.on('data', (data) => {
                if (data.type === 'init') {
                    createRemotePlayer(conn.peer, data.color);
                    conn.send({ type: 'init_reply', color: myColor });
                } else if (data.type === 'init_reply') {
                    createRemotePlayer(conn.peer, data.color);
                } else if (data.type === 'update') {
                    if (remotePlayers[conn.peer]) {
                        // Smooth interpolation could be added here for better visual quality
                        remotePlayers[conn.peer].position.set(data.x, data.y, data.z);
                        remotePlayers[conn.peer].rotation.y = data.ry;
                    } else {
                        // Missed init packet, spawn default
                        createRemotePlayer(conn.peer, '#888888');
                    }
                }
            });

            conn.on('close', () => {
                removeRemotePlayer(conn.peer);
                connections = connections.filter(c => c !== conn);
                updatePlayerCount();
            });
        }

        function broadcastState() {
            if (!myCar || connections.length === 0) return;
            
            const data = {
                type: 'update',
                x: myCar.position.x,
                y: myCar.position.y,
                z: myCar.position.z,
                ry: myCar.rotation.y
            };

            connections.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        function createRemotePlayer(peerId, colorHex) {
            if (remotePlayers[peerId]) return; 
            const rCar = createCar(colorHex);
            scene.add(rCar);
            remotePlayers[peerId] = rCar;
        }

        function removeRemotePlayer(peerId) {
            if (remotePlayers[peerId]) {
                scene.remove(remotePlayers[peerId]);
                delete remotePlayers[peerId];
            }
        }

        function updatePlayerCount() {
            if(document.getElementById('player-count')) {
                document.getElementById('player-count').textContent = `Players: ${connections.length + 1}`;
            }
        }

        // =========================================================================
        // UI & Flow
        // =========================================================================

        function preloadAndStart() {
            document.getElementById('connection-status').textContent = 'Loading models...';
            document.getElementById('connection-status').classList.replace('text-red-500', 'text-blue-500');
            
            preloadCarModel(() => {
                startGame();
            });
        }

        function startGame() {
            document.getElementById('ui-container').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            document.getElementById('display-room-code').textContent = myRoomId;
            updatePlayerCount();

            // Instantiate local car
            myCar = createCar(myColor);
            
            // Start slightly offset to avoid overlapping exactly on start
            myCar.position.set( (Math.random() - 0.5) * 10, 0, (Math.random() - 0.5) * 10 );
            scene.add(myCar);

            gameState = 'playing';
        }

        // Bind UI Buttons
        document.getElementById('btn-create').addEventListener('click', () => {
            initGame(true);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const code = document.getElementById('join-code').value.trim();
            if (code.length === 3) {
                initGame(false, code);
            } else {
                const status = document.getElementById('connection-status');
                status.textContent = 'Please enter a 3-digit code.';
                status.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
